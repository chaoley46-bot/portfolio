<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo — Création d'un ticket (portail utilisateur)</title>
<link rel="stylesheet" href="vendor/font-awesome.min.css">
<style>
:root{--blue:rgb(1,25,115);--orange:rgb(254,67,41);--bg:#f4f6fb;--border:rgba(1,25,115,.14);--muted:rgba(1,25,115,.55)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--blue);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px}
.demo{background:var(--orange);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:5px}
header{background:var(--blue);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;letter-spacing:1px}.logo b{color:var(--orange)}
header nav{display:flex;gap:6px;margin-left:auto}header nav a{color:#fff;text-decoration:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13.5px;opacity:.85}
header nav a.on{background:rgba(255,255,255,.14);opacity:1}
.wrap{max-width:1060px;margin:22px auto;padding:0 18px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.cat{background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:11px;align-items:center;text-align:left;color:var(--blue);font:inherit}
.cat i{font-size:22px}.cat strong{display:block;font-size:13.5px}.cat span{font-size:12px;color:var(--muted)}
.cat.on{border-color:var(--orange);background:#fff7f5}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
.card-h .ic{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.card-h h2{margin:0;font-size:18px}.card-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:5fr 7fr}
.left{padding:20px 22px;border-right:1px solid var(--border);background:#fafbff}.right{padding:20px 22px}
.sec-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--muted);margin:0 0 10px}
.f{margin-bottom:13px}.f label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}.f label .r{color:var(--orange)}
.f input[type=text],.f input[type=email],.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font:inherit;color:var(--blue);background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--orange)}
.hint{font-size:12px;color:var(--muted);margin-top:4px;display:block}
.radios{display:flex;gap:8px}.radios label{flex:1;margin:0;border:1.5px solid var(--border);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;gap:7px;align-items:center;background:#fff;font-weight:700}
.radios label.on{border-color:var(--orange);background:#fff7f5}
.paste{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13px;background:#fafbff}
.paste u{color:var(--blue);font-weight:700;cursor:pointer}
.err{background:#fdecea;color:#a32d2d;padding:9px 12px;border-radius:9px;margin-bottom:12px;font-size:13px;display:none}
.btns{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:#fafbff}
.btn{border:0;border-radius:50px;padding:11px 26px;font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--orange)}.btn.g{background:#fff;border:1.5px solid var(--border);color:var(--blue)}
.ok{text-align:center;padding:50px 24px}.ok .big{font-size:46px;color:#0a6040}.ok h2{margin:10px 0 6px}.ok p{color:var(--muted);margin:4px 0}
.num{display:inline-block;background:var(--bg);border-radius:10px;padding:8px 16px;font-weight:800;font-size:17px;margin:10px 0}
@media(max-width:820px){.split{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--border)}.cats{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="demo">DÉMONSTRATION — formulaire de création de ticket (portail utilisateur) · aucune donnée n'est envoyée</div>
<header><div class="logo">UDAF <b>47</b></div><div style="opacity:.8;font-size:13px">Assistance informatique</div>
<nav><a class="on" href="#">Ouvrir un ticket</a><a href="#" onclick="return false">Voir l'état d'un ticket</a><a href="#" onclick="return false">Connexion</a></nav></header>
<div class="wrap" id="root"></div>
<script>
var CATS=[
 {id:'probleme',ic:'icon-warning-sign',t:"Demande d'assistance",d:'Ordinateur, logiciel, imprimante…',h:"Demande d'assistance",s:"Décrivez votre problème, un technicien vous répond par e-mail."},
 {id:'materiel',ic:'icon-inbox',t:'Demande de matériel',d:'Réserver un équipement',h:'Demande de matériel',s:'Le stock disponible est affiché en direct.'},
 {id:'acces',ic:'icon-lock',t:"Demande d'accès",d:'Bureau virtuel, VPN, boîte e-mail',h:"Demande d'accès",s:"Pour obtenir un accès, pas pour signaler une panne."},
 {id:'phishing',ic:'icon-envelope',t:'Mail frauduleux',d:'Signaler un e-mail suspect',h:'Signaler un mail frauduleux',s:'Ne cliquez sur aucun lien : décrivez le mail ou collez une capture.'}];
var STOCK={'Souris':6,'Clavier':4,'Casque':3,'Écran':2,'Câble HDMI':9};
var SITES=['Agen','Marmande','Fumel','Villeneuve-sur-Lot'];
var cat='probleme',prio='non',done=null;
function render(){
  var root=document.getElementById('root'),c=CATS.filter(function(x){return x.id===cat})[0];
  if(done){root.innerHTML='<div class="card ok"><div class="big"><i class="icon-ok-sign"></i></div><h2>Votre demande a bien été enregistrée</h2><div class="num">Ticket #'+done.n+'</div><p>Un e-mail de confirmation vient d\'être envoyé à <b>'+done.m+'</b>.</p><p>'+done.s+'</p><p style="margin-top:18px"><button class="btn p" onclick="done=null;render()">Faire une nouvelle demande</button></p></div>';return;}
  var h='<div class="cats">'+CATS.map(function(x){return '<button class="cat'+(x.id===cat?' on':'')+'" data-c="'+x.id+'"><i class="'+x.ic+'"></i><div><strong>'+x.t+'</strong><span>'+x.d+'</span></div></button>'}).join('')+'</div>';
  h+='<form class="card" id="f" novalidate><div class="card-h"><div class="ic"><i class="icon-ticket"></i></div><div><h2>'+c.h+'</h2><p>'+c.s+'</p></div></div><div class="split"><div class="left"><div class="sec-t">Vos coordonnées</div>'+
  '<div class="f"><label>Nom complet <span class="r">*</span></label><input type="text" id="nom" value="Camille Durand"></div>'+
  '<div class="f"><label>Adresse e-mail <span class="r">*</span></label><input type="email" id="mail" value="camille.durand@exemple.fr"></div>';
  if(cat!=='acces'&&cat!=='phishing') h+='<div class="f"><label>Site <span class="r">*</span></label><select id="site">'+SITES.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div>';
  if(cat==='probleme') h+='<div class="sec-t" style="margin-top:18px">Votre demande</div><div class="f"><label>Priorité</label><div class="radios"><label class="'+(prio==='non'?'on':'')+'"><input type="radio" name="p" value="non" '+(prio==='non'?'checked':'')+'> Non bloquant</label><label class="'+(prio==='bloq'?'on':'')+'"><input type="radio" name="p" value="bloq" '+(prio==='bloq'?'checked':'')+'> 🚫 Bloquant</label></div><span class="hint">« Bloquant » : vous ne pouvez plus travailler.</span></div>';
  h+='</div><div class="right"><div class="sec-t">Détails de votre demande</div><div class="err" id="err">Le message est obligatoire.</div>';
  if(cat==='materiel') h+='<div class="f"><label>Type de matériel <span class="r">*</span></label><select id="mat">'+Object.keys(STOCK).map(function(k){return '<option value="'+k+'">'+k+' — '+STOCK[k]+' en stock</option>'}).join('')+'</select></div>';
  if(cat==='acces') h+='<div class="f"><label>Catégorie d\'accès <span class="r">*</span></label><select id="acc"><option>Ordinateur virtuel (RDS)</option><option>Connexion à distance (VPN)</option><option>Boîte e-mail partagée</option></select></div>';
  if(cat==='probleme'||cat==='phishing') h+='<div class="f"><label>Sujet <span class="r">*</span></label><input type="text" id="suj" placeholder="'+(cat==='phishing'?'Sujet du mail suspect':'Résumé du problème')+'"></div>';
  h+='<div class="f"><label>'+(cat==='phishing'?'Description / contenu du mail':'Message')+' <span class="r">*</span></label><textarea id="msg" rows="6" placeholder="Détails de votre demande…"></textarea></div>';
  if(cat==='probleme'||cat==='phishing') h+='<div class="f"><label>Captures d\'écran (facultatif)</label><div class="paste"><i class="icon-camera"></i> Faites <b>Windows + Maj + S</b>, cliquez ici puis collez avec <b>Ctrl + V</b><br>ou <u>choisissez un ou plusieurs fichiers</u></div></div>';
  h+='</div></div><div class="btns"><button type="reset" class="btn g" id="rst">Réinitialiser</button><button type="submit" class="btn p">Envoyer ma demande</button></div></form>';
  root.innerHTML=h;
  [].forEach.call(root.querySelectorAll('.cat'),function(b){b.onclick=function(){cat=b.dataset.c;render()}});
  [].forEach.call(root.querySelectorAll('input[name=p]'),function(r){r.onchange=function(){prio=r.value;render()}});
  document.getElementById('rst').onclick=function(e){e.preventDefault();prio='non';render()};
  document.getElementById('f').onsubmit=function(e){e.preventDefault();
    if(!document.getElementById('msg').value.trim()){document.getElementById('err').style.display='block';return;}
    var s=cat==='materiel'?'Le matériel « '+document.getElementById('mat').value+' » est réservé à votre nom.':cat==='phishing'?'Le service informatique analyse le mail signalé.':'Un technicien vous répondra par e-mail.';
    done={n:583205+Math.floor(Math.random()*40),m:document.getElementById('mail').value,s:s};render();};
}
render();
</script></body></html>
